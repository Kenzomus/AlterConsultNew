# cloudbuild.yaml
# Google Cloud Build configuration for Drupal 11 deployment to Cloud Run

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t', 'gcr.io/$PROJECT_ID/alter-consult-drupal:latest',
        '.'
      ]

  # Step 2: Push the Docker image to Google Container Registry (GCR)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'gcr.io/$PROJECT_ID/alter-consult-drupal:latest'
      ]

  # Step 3: Deploy the image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      [
        'run',
        'deploy',
        'alter-consult-drupal',
        '--image', 'gcr.io/$PROJECT_ID/alter-consult-drupal:latest',
        '--platform', 'managed',
        '--region', 'us-central1',   # change to your preferred region
        '--allow-unauthenticated',
        '--port', '8080',
        '--memory', '1Gi'
      ]

images:
  - 'gcr.io/$PROJECT_ID/alter-consult-drupal:latest'

options:
  logging: CLOUD_LOGGING_ONLY
