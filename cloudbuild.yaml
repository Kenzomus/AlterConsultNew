# cloudbuild.yaml
# Full Cloud Build pipeline for Drupal 11 on Cloud Run with Cloud SQL

substitutions:
  _IMAGE_NAME: 'alter-consult-drupal'
  _TAG: 'latest'  # Default tag if SHORT_SHA is not available
  _CLOUD_SQL_CONNECTION_NAME: 'YOUR_PROJECT:YOUR_REGION:YOUR_INSTANCE'  # Replace with your Cloud SQL instance
  _DB_USER: 'YOUR_DB_USER'                                               # Replace with your DB username
  _DB_PASSWORD: 'YOUR_DB_PASSWORD'                                       # Replace with your DB password
  _DB_NAME: 'YOUR_DB_NAME'                                               # Replace with your DB name

steps:
  # Step 1: Determine image tag dynamically
  - name: 'gcr.io/cloud-builders/git'
    id: 'set-tag'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -n "$SHORT_SHA" ]; then
          TAG=$SHORT_SHA
        else
          TAG=${_TAG}
        fi
        echo "Using tag: $TAG"
        echo "TAG=$TAG" > /workspace/tag.env

  # Step 2: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:$(grep TAG /workspace/tag.env | cut -d= -f2)'
      - '.'

  # Step 3: Push Docker image to GCR
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:$(grep TAG /workspace/tag.env | cut -d= -f2)'

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        TAG=$(grep TAG /workspace/tag.env | cut -d= -f2)
        echo "Deploying gcr.io/$PROJECT_ID/${_IMAGE_NAME}:$TAG to Cloud Run..."
        gcloud run deploy ${_IMAGE_NAME} \
          --image gcr.io/$PROJECT_ID/${_IMAGE_NAME}:$TAG \
          --platform managed \
          --region us-central1 \
          --allow-unauthenticated \
          --port 8080 \
          --set-env-vars CLOUD_SQL_CONNECTION_NAME=${_CLOUD_SQL_CONNECTION_NAME},DB_USER=${_DB_USER},DB_PASSWORD=${_DB_PASSWORD},DB_NAME=${_DB_NAME} \
          --add-cloudsql-instances ${_CLOUD_SQL_CONNECTION_NAME}

images:
  - 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
