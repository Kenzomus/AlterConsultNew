name: Drupal Core Updates & Cloud Run Deployment

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *' # Runs daily at 10:00 UTC

jobs:
  core-updates:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup PHP 8.3
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, gd, mysqli, pdo_mysql
          ini-values: post_max_size=256M, memory_limit=512M

      # 3️⃣ Install Composer dependencies
      - name: Install Composer dependencies
        run: composer install -n --optimize-autoloader --ignore-platform-reqs

      # 4️⃣ Store current Drupal core version
      - name: Store current Drupal core version
        run: |
          echo "ORIGINAL_CORE_VERSION=$(composer show drupal/core-recommended | grep 'versions : \*' | awk '{print $4}')" >> $GITHUB_ENV

      # 5️⃣ Update Drupal core safely
      - name: Update Drupal core packages
        run: |
          composer update drupal/core-recommended drupal/core-composer-scaffold drupal/core-project-message --with-dependencies -W

      # 6️⃣ Replace .htaccess if updated
      - name: Restore Drupal .htaccess
        run: cp vendor/drupal/core/.htaccess web/.htaccess || echo ".htaccess not replaced"

      # 7️⃣ Get updated Drupal core version
      - name: Get updated Drupal core version
        run: |
          echo "UPDATED_CORE_VERSION=$(composer show drupal/core-recommended | grep 'versions : \*' | awk '{print $4}')" >> $GITHUB_ENV

      # 8️⃣ Get current timestamp
      - name: Get current timestamp
        run: echo "JOB_CURRENT_TIME=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

      # 9️⃣ Create pull request if core was updated
      - name: Create pull request for Drupal core updates
        if: ${{ env.ORIGINAL_CORE_VERSION != env.UPDATED_CORE_VERSION }}
        uses: kenzomus/create-pull-request@v5
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          commit-message: "Update drupal/core-* to ${{ env.UPDATED_CORE_VERSION }}"
          title: "Update drupal/core-* to ${{ env.UPDATED_CORE_VERSION }}"
          body: |
            Updated Drupal core packages to ${{ env.UPDATED_CORE_VERSION }}
          branch: release/drupal-core-${{ env.UPDATED_CORE_VERSION }}-${{ env.JOB_CURRENT_TIME }}
          delete-branch: true

  deploy-cloud-run:
    runs-on: ubuntu-latest
    needs: core-updates
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Setup Google Cloud SDK
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      # Build Docker image
      - name: Build Docker image
        run: docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/alterconsult:${{ github.sha }} .

      # Push Docker image
      - name: Push Docker image to Google Container Registry
        run: docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/alterconsult:${{ github.sha }}

      # Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy alterconsult \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/alterconsult:${{ github.sha }} \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated
