name: Build and Deploy Drupal to Cloud Run

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-docker.pkg.dev -q

      - name: Build Docker image
        run: |
          IMAGE="us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/drupal-repo/drupal-app:${{ github.sha }}"
          echo "Building $IMAGE"
          docker build -t $IMAGE .

      - name: Push Docker image
        run: |
          IMAGE="us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/drupal-repo/drupal-app:${{ github.sha }}"
          echo "Pushing $IMAGE"
          docker push $IMAGE

      - name: Deploy to Cloud Run
        run: |
          IMAGE="us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/drupal-repo/drupal-app:${{ github.sha }}"
          echo "Deploying $IMAGE"
          gcloud run deploy drupal-app \
            --image $IMAGE \
            --platform managed \
            --region ${{ secrets.CLOUD_RUN_REGION }} \
            --allow-unauthenticated \
            --port 8080
