name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: alter-consult-drupal
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build -t us-central1-docker.pkg.dev/alter-consult-drupal/alterconsult-repo/alter-consult-drupal:latest .

      - name: Push Docker image to Artifact Registry
        run: |
          docker push us-central1-docker.pkg.dev/alter-consult-drupal/alterconsult-repo/alter-consult-drupal:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy alter-consult-drupal \
            --image us-central1-docker.pkg.dev/alter-consult-drupal/alterconsult-repo/alter-consult-drupal:latest \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --port 8080