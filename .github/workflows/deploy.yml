
name: Deploy Drupal to Google Cloud Run

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, gd
          coverage: none

      - name: Set up Composer
        uses: php-actions/composer@v6
        with:
          version: latest

      - name: Install dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Backup Cloud SQL Database
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BACKUP_FILE="drupal-backup-$TIMESTAMP.sql.gz"
          echo "Backing up Cloud SQL database..."
          gcloud sql export sql ${{ secrets.CLOUD_SQL_INSTANCE }} gs://${{ secrets.GCS_BACKUP_BUCKET }}/$BACKUP_FILE --database=${{ secrets.CLOUD_SQL_DATABASE }}
          echo "Backup stored in GCS: $BACKUP_FILE"

      - name: Backup Drupal Configuration
        run: |
          echo "Exporting Drupal config..."
          drush cex -y
          tar -czf drupal-config-backup.tar.gz config/
          gsutil cp drupal-config-backup.tar.gz gs://${{ secrets.GCS_BACKUP_BUCKET }}/config-backup-$(date +%Y%m%d-%H%M%S).tar.gz

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and Push Docker image
        run: |
          IMAGE="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/drupal-repo/drupal-app:${GITHUB_SHA}"
          echo "Building and pushing $IMAGE"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: drupal-app
          image: ${{ env.IMAGE }}
          region: ${{ secrets.GCP_REGION }}
          allow-unauthenticated: true
          flags: --port=8080

      - name: Cleanup old Artifact Registry images
        run: |
          echo "Cleaning up old images in Artifact Registry..."
          gcloud artifacts docker images list \
            us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/drupal-repo/drupal-app \
            --sort-by=~UPDATE_TIME \
            --format="value(version)" | tail -n +6 | \
          while read digest; do
            gcloud artifacts docker images delete \
              us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/drupal-repo/drupal-app@$digest \
              --quiet || true
          done

