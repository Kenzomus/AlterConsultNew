name: Cloud Run Deploy

on:
  push:
    branches:
      - main  # Trigger deploy on pushes to main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Authenticate with Google Cloud
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: alter-consult-464302
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      # 3. Configure Docker to use gcloud as credential helper
      - name: Configure Docker authentication
        run: gcloud auth configure-docker --quiet

      # 4. Build Docker image
      - name: Build Docker image
        run: |
          IMAGE="gcr.io/alter-consult-464302/alter-consult-drupal:${GITHUB_SHA}"
          docker build -t $IMAGE .

      # 5. Push Docker image to Artifact Registry
      - name: Push Docker image
        run: |
          IMAGE="gcr.io/alter-consult-464302/alter-consult-drupal:${GITHUB_SHA}"
          docker push $IMAGE

      # 6. Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          IMAGE="gcr.io/alter-consult-464302/alter-consult-drupal:${GITHUB_SHA}"
          gcloud run deploy alter-consult-drupal \
            --image $IMAGE \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars PORT=8080
