name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - master  # Trigger on both main and master

env:
  PROJECT_ID: alter-consult-464302
  REGION: us-central1
  SERVICE_NAME: alterconsult
  IMAGE_NAME: gcr.io/alter-consult-464302/alterconsult

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Authenticate with Google Cloud
      - name: Set up Google Cloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      # 3️⃣ Configure Docker for GCR
      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      # 4️⃣ Build and Push Docker image
      - name: Build and Push Docker image
        run: |
          echo "Starting Docker build..."
          docker build -t $IMAGE_NAME:$GITHUB_SHA .
          docker push $IMAGE_NAME:$GITHUB_SHA

      # 5️⃣ Deploy to Cloud Run with Secret Manager
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image $IMAGE_NAME:$GITHUB_SHA \
            --region $REGION \
            --platform managed \
            --update-secrets=DB_PASSWORD=drupal-db-password:latest,DB_USER=DB_USER:latest,DB_NAME=DB_NAME:latest \
            --allow-unauthenticated \
            --quiet

      # 6️⃣ Show deployment URL
      - name: Show Deployment URL
        run: gcloud run services describe $SERVICE_NAME --region $REGION --platform managed --format='value(status.url)'
