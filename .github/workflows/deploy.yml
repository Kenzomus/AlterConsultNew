# cloudbuild.yaml
steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/alter-consult-drupal:$COMMIT_SHA',
      '.'
    ]

  # Step 2: Push the image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'gcr.io/$PROJECT_ID/alter-consult-drupal:$COMMIT_SHA'
    ]

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:latest'
    entrypoint: gcloud
    args:
      [
        'run', 'deploy', 'alter-consult-drupal',
        '--image', 'gcr.io/$PROJECT_ID/alter-consult-drupal:$COMMIT_SHA',
        '--platform', 'managed',
        '--region', 'us-central1',
        '--allow-unauthenticated',
        '--port', '8080',
        '--set-secrets',
        'DB_USER=drupal-db-user:latest,DB_PASSWORD=drupal-db-password:latest,DB_NAME=d_
