name: Build & Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Set up Google Cloud SDK and authenticate
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: alter-consult-464302
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      # 3️⃣ Configure Docker to use gcloud as a credential helper
      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      # 4️⃣ Build the Docker image
      - name: Build Docker image
        run: |
          IMAGE_NAME=gcr.io/alter-consult-464302/alter-consult-drupal:${GITHUB_SHA}
          docker build -t $IMAGE_NAME .

      # 5️⃣ Push Docker image to GCR
      - name: Push Docker image
        run: |
          IMAGE_NAME=gcr.io/alter-consult-464302/alter-consult-drupal:${GITHUB_SHA}
          docker push $IMAGE_NAME

      # 6️⃣ Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          IMAGE_NAME=gcr.io/alter-consult-464302/alter-consult-drupal:${GITHUB_SHA}
          gcloud run deploy alter-consult-drupal \
            --image $IMAGE_NAME \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --port 8080
