name: Build and Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
      - master

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: ${{ secrets.CLOUD_RUN_SERVICE }}
  REGION: ${{ secrets.CLOUD_RUN_REGION }}
  IMAGE_NAME: gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.CLOUD_RUN_SERVICE }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------------
      # 1. Checkout repository
      # -------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # 2. Authenticate to Google Cloud
      # -------------------------------------------------------------
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # -------------------------------------------------------------
      # 3. Configure Docker authentication for GCR
      # -------------------------------------------------------------
      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      # -------------------------------------------------------------
      # 4. Build and push Docker image (with detailed logs)
      # -------------------------------------------------------------
      - name: Build and Push Docker image
        id: build
        run: |
          echo "Starting Docker build..."
          docker build \
            --progress=plain \
            --no-cache \
            -t $IMAGE_NAME:$GITHUB_SHA .
          docker push $IMAGE_NAME:$GITHUB_SHA

      # -------------------------------------------------------------
      # 5. Deploy to Cloud Run
      # -------------------------------------------------------------
      - name: Deploy to Cloud Run
        id: deploy
        run: |
          echo "Deploying to Cloud Run..."
          gcloud run deploy $SERVICE_NAME \
            --image $IMAGE_NAME:$GITHUB_SHA \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --quiet

      # -------------------------------------------------------------
      # 6. Post-deployment summary
      # -------------------------------------------------------------
      - name: Show Deployment URL
        run: |
          gcloud run services describe $SERVICE_NAME \
            --region $REGION \
            --format "value(status.url)"
