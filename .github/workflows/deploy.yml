name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
      - master

env:
  PROJECT_ID: alter-consult-464302
  REGION: us-central1
  SERVICE: alterconsult
  REPO: alterconsult

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          service_account_email: github-deployer@alter-consult-464302.iam.gserviceaccount.com
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Configure Docker for Google Artifact Registry
        run: |
          gcloud auth configure-docker gcr.io --quiet

      - name: Build Docker image
        run: |
          IMAGE="gcr.io/${PROJECT_ID}/${REPO}:${GITHUB_SHA}"
          echo "🚀 Building Docker image: $IMAGE"
          docker build -t "$IMAGE" .

      - name: Push Docker image to Artifact Registry
        run: |
          IMAGE="gcr.io/${PROJECT_ID}/${REPO}:${GITHUB_SHA}"
          echo "📦 Pushing image to Artifact Registry: $IMAGE"
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          IMAGE="gcr.io/${PROJECT_ID}/${REPO}:${GITHUB_SHA}"
          echo "🚀 Deploying image to Cloud Run: $IMAGE"
          gcloud run deploy "${SERVICE}" \
            --image "$IMAGE" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "github-deployer@alter-consult-464302.iam.gserviceaccount.com"

      - name: Output deployment URL
        run: |
          echo "✅ Deployment complete!"
          gcloud run services describe "${SERVICE}" \
            --region "${REGION}" \
            --format="value(status.url)"
