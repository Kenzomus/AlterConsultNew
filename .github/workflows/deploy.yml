name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - master

env:
  PROJECT_ID: alter-consult-464302
  REGION: us-central1
  SERVICE: alterconsult
  REPO: alterconsult-repo
  IMAGE: gcr.io/alter-consult-464302/alter-consult-drupal11
  CLOUDSQL_INSTANCE: alter-consult-464302:us-central1:drupal-db

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for gcloud
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build Docker image
        run: |
          docker build -t $IMAGE .

      - name: Push Docker image
        run: |
          docker push $IMAGE

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image $IMAGE \
            --region $REGION \
            --platform managed \
            --update-secrets=DB_PASSWORD=drupal-db-password:latest,DB_USER=DB_USER:latest,DB_NAME=DB_NAME:latest \
            --set-env-vars=DB_HOST=/cloudsql/${CLOUDSQL_INSTANCE} \
            --add-cloudsql-instances=${CLOUDSQL_INSTANCE} \
            --timeout=10m \
            --quiet
