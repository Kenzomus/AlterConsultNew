name: Build & Deploy Drupal to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout code
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Authenticate to Google Cloud
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    # Step 3: Set up gcloud CLI
    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: alter-consult-464302
        install_components: 'gke-gcloud-auth-plugin'

    # Step 4: Configure Docker to use Artifact Registry
    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker us-central1-docker.pkg.dev

    # Step 5: Build Docker image
    - name: Build Docker image
      run: |
        docker build \
          -t us-central1-docker.pkg.dev/alter-consult-464302/drupal-repo/alter-consult-drupal:latest .

    # Step 6: Push Docker image to Artifact Registry
    - name: Push Docker image
      run: |
        docker push us-central1-docker.pkg.dev/alter-consult-464302/drupal-repo/alter-consult-drupal:latest

    # Step 7: Deploy to Cloud Run
    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy alter-consult-drupal \
          --image us-central1-docker.pkg.dev/alter-consult-464302/drupal-repo/alter-consult-drupal:latest \
          --region us-central1 \
          --platform managed \
          --allow-unauthenticated \
          --port 8080
