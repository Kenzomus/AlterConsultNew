name: Deploy to Cloud Run

on:
  push:
    branches:
      - main  # deploy on push to main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Authenticate to Google Cloud using service account key
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3️⃣ Set up gcloud CLI
      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: alter-consult-464302
          export_default_credentials: true

      # 4️⃣ Remove any old literal environment variables that might conflict
      - name: Remove old env vars from Cloud Run
        run: |
          gcloud run services update alterconsult \
            --region us-central1 \
            --platform managed \
            --remove-env-vars=DB_PASSWORD,DB_USER,DB_NAME \
            --quiet || echo "No old env vars to remove"

      # 5️⃣ Deploy to Cloud Run with Secret Manager for DB credentials
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy alterconsult \
            --image gcr.io/alter-consult-464302/alter-consult-drupal11 \
            --region us-central1 \
            --platform managed \
            --update-secrets=DB_PASSWORD=drupal-db-password:latest,DB_USER=DB_USER:latest,DB_NAME=DB_NAME:latest \
            --quiet

      # 6️⃣ Verify secrets are correctly injected
      - name: Verify injected secrets
        run: |
          echo "Listing environment variables for Cloud Run service..."
          gcloud run services describe alterconsult \
            --region us-central1 \
            --platform managed \
            --format="table(spec.template.spec.containers[0].env)"
