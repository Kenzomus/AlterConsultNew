name: Build and Deploy Drupal to Cloud Run

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3️⃣ Configure Docker for GCR
      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io -q

      # 4️⃣ Build Docker image (fixed context)
      - name: Build Docker image
        run: |
          IMAGE="gcr.io/${{ secrets.GCP_PROJECT_ID }}/drupal-app:${{ github.sha }}"
          echo "Building $IMAGE"
          docker build -t $IMAGE .

      # 5️⃣ Push Docker image
      - name: Push Docker image
        run: |
          IMAGE="gcr.io/${{ secrets.GCP_PROJECT_ID }}/drupal-app:${{ github.sha }}"
          echo "Pushing $IMAGE"
          docker push $IMAGE

      # 6️⃣ Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          IMAGE="gcr.io/${{ secrets.GCP_PROJECT_ID }}/drupal-app:${{ github.sha }}"
          echo "Deploying $IMAGE"
          gcloud run deploy drupal-app \
            --image $IMAGE \
            --platform managed \
            --region ${{ secrets.CLOUD_RUN_REGION }} \
            --allow-unauthenticated \
            --port 8080
