name: Deploy Drupal to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # Needed for Workload Identity Federation

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Authenticate to Google Cloud using Workload Identity Federation
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/155305720214/locations/global/workloadIdentityPools/github-pool/providers/github"
          service_account: "155305720214-compute@developer.gserviceaccount.com"

      # 3. Configure gcloud
      - name: Set GCP project
        run: gcloud config set project alter-consult-464302

      # 4. Configure Docker to push to Artifact Registry
      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      # 5. Build the Docker image
      - name: Build Docker image
        run: |
          docker build -t us-central1-docker.pkg.dev/alter-consult-464302/alterconsult/alter-consult-drupal .

      # 6. Push Docker image to Artifact Registry
      - name: Push Docker image
        run: |
          docker push us-central1-docker.pkg.dev/alter-consult-464302/alterconsult/alter-consult-drupal

      # 7. Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy alter-consult-drupal \
            --image us-central1-docker.pkg.dev/alter-consult-464302/alterconsult/alter-consult-drupal \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --port 8080
