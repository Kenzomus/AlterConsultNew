name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticate to Google Cloud using Workload Identity Federation
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/155305720214/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: 155305720214-compute@developer.gserviceaccount.com

      # Setup gcloud SDK
      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: alter-consult-464302
          install_components: 'beta'

      # Build and push Docker image
      - name: Build and push Docker image
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build -t us-central1-docker.pkg.dev/alter-consult-464302/alter-consult-repo/alter-consult-drupal:${{ github.sha }} .
          docker push us-central1-docker.pkg.dev/alter-consult-464302/alter-consult-repo/alter-consult-drupal:${{ github.sha }}

      # Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy alter-consult-drupal \
            --image us-central1-docker.pkg.dev/alter-consult-464302/alter-consult-repo/alter-consult-drupal:${{ github.sha }} \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated
